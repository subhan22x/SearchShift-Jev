<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" role="img" aria-labelledby="title desc"><title id="title">SearchShift-Jev · from text to a useful card</title><desc id="desc">A predictable loop: keep up with typing, surface the likely destination, fill only grounded values, then let the user decide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657D"/></marker><style>.title{font:700 35px Inter,system-ui,sans-serif;fill:#18283D}.subtitle{font:17px Inter,system-ui,sans-serif;fill:#52657D}.node-title{font:700 18px Inter,system-ui,sans-serif;fill:#18283D}.node-line{font:15px Inter,system-ui,sans-serif;fill:#52657D}.footer{font:15px Inter,system-ui,sans-serif;fill:#52657D}</style></defs><rect width="100%" height="100%" rx="24" fill="#F7F9FC"/><text x="55" y="63" class="title">SearchShift-Jev · from text to a useful card</text><text x="55" y="99" class="subtitle">A predictable loop: keep up with typing, surface the likely destination, fill only grounded values, then let the user decide.</text><path d="M 290 238 C 322.5 238, 322.5 238, 355 238" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>

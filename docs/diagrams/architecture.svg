<g><rect x="1160" y="485" width="315" height="112" rx="18" fill="#E7F6F6" stroke="#66B9B5" stroke-width="2"/><rect x="1160" y="485" width="8" height="112" rx="4" fill="#277D79"/><text x="1181" y="515" class="node-title">App candidates</text><text x="1181" y="550" class="node-line">up to 3 supported apps</text><text x="1181" y="573" class="node-line">shown above task cards</text></g>

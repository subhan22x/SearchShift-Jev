<path d="M 960 238 C 997.5 238, 997.5 238, 1035 238" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1280 238 C 1290 238, 1290 190, 1300 190" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1280 238 C 1290 238, 1290 360, 1300 360" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1300 360 C 1292.5 360, 1292.5 577.5, 1285 577.5" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 1000 577.5 C 962.5 577.5, 962.5 577.5, 925 577.5" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1030" role="img" aria-labelledby="title desc"><title id="title">SearchShift-Jev · system architecture</title><desc id="desc">JEV routes a query into a bounded app or card; code validates, renders, and keeps each draft editable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657D"/></marker><style>.title{font:700 35px Inter,system-ui,sans-serif;fill:#18283D}.subtitle{font:17px Inter,system-ui,sans-serif;fill:#52657D}.node-title{font:700 18px Inter,system-ui,sans-serif;fill:#18283D}.node-line{font:15px Inter,system-ui,sans-serif;fill:#52657D}.footer{font:15px Inter,system-ui,sans-serif;fill:#52657D}</style></defs><rect width="100%" height="100%" rx="24" fill="#F7F9FC"/><text x="55" y="63" class="title">SearchShift-Jev · system architecture</text><text x="55" y="99" class="subtitle">JEV routes a query into a bounded app or card; code validates, renders, and keeps each draft editable.</text><path d="M 275 228 C 300 228, 300 228, 325 228" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>

<g><rect x="375" y="808" width="270" height="100" rx="18" fill="#FFF4DF" stroke="#E2B45E" stroke-width="2"/><rect x="375" y="808" width="8" height="100" rx="4" fill="#B67B1F"/><text x="396" y="838" class="node-title">Optional extraction</text><text x="396" y="873" class="node-line">supported card · 550 ms pause</text><text x="396" y="896" class="node-line">local parser remains available</text></g>
<g><rect x="700" y="808" width="210" height="100" rx="18" fill="#EAF3FF" stroke="#5A8BD6" stroke-width="2"/><rect x="700" y="808" width="8" height="100" rx="4" fill="#3973BD"/><text x="721" y="838" class="node-title">POST /api/extract</text><text x="721" y="873" class="node-line">intent schema</text><text x="721" y="896" class="node-line">key stays server-side</text></g>
<g><rect x="965" y="808" width="230" height="100" rx="18" fill="#F2EDFF" stroke="#9877DC" stroke-width="2"/><rect x="965" y="808" width="8" height="100" rx="4" fill="#7652C8"/><text x="986" y="838" class="node-title">OpenRouter · Gemini</text><text x="986" y="873" class="node-line">strict JSON fields</text><text x="986" y="896" class="node-line">query is untrusted input</text></g>
<g><rect x="1250" y="808" width="250" height="100" rx="18" fill="#FFF0F0" stroke="#DA8989" stroke-width="2"/><rect x="1250" y="808" width="8" height="100" rx="4" fill="#AA4F54"/><text x="1271" y="838" class="node-title">Ground + merge</text><text x="1271" y="873" class="node-line">evidence checked; values return</text><text x="1271" y="896" class="node-line">to the editable card draft</text></g><text x="55" y="1002" class="footer">Classifier failure is visible and retryable—there is no local rule-based intent fallback. Native Android execution and private data access are outside this web prototype.</text></svg>
<path d="M 172.5 301 C 172.5 403, 142.5 403, 142.5 505" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 820 321 C 820 338, 875 338, 875 355" fill="none" stroke="#C9D5E3" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="55" y="175" width="235" height="126" rx="18" fill="#EAF3FF" stroke="#5A8BD6" stroke-width="2"/><rect x="55" y="175" width="8" height="126" rx="4" fill="#3973BD"/><text x="76" y="205" class="node-title">1 · Type a thought</text><text x="76" y="240" class="node-line">“coffee with Alex Friday at 1”</text><text x="76" y="263" class="node-line">or a short app query</text></g>
<g><rect x="355" y="175" width="260" height="126" rx="18" fill="#E7F6F6" stroke="#66B9B5" stroke-width="2"/><rect x="355" y="175" width="8" height="126" rx="4" fill="#277D79"/><text x="376" y="205" class="node-title">2 · Predict prefixes</text><text x="376" y="240" class="node-line">JEV call is throttled</text><text x="376" y="263" class="node-line">latest typed prefix wins</text></g>
<g><rect x="680" y="155" width="280" height="166" rx="18" fill="#F2EDFF" stroke="#9877DC" stroke-width="2"/><rect x="680" y="155" width="8" height="166" rx="4" fill="#7652C8"/><text x="701" y="185" class="node-title">3 · JEV answers in parallel</text><text x="701" y="220" class="node-line">app, task, and confidence</text><text x="701" y="243" class="node-line">+ keep-app-results signal</text><text x="701" y="266" class="node-line">no generated markup/actions</text></g>
<g><rect x="1035" y="175" width="245" height="126" rx="18" fill="#FFF4DF" stroke="#E2B45E" stroke-width="2"/><rect x="1035" y="175" width="8" height="126" rx="4" fill="#B67B1F"/><text x="1056" y="205" class="node-title">4 · Choose presentation</text><text x="1056" y="240" class="node-line">app-first · dual · task-only</text><text x="1056" y="263" class="node-line">old prefix holds while pending</text></g>
<g><rect x="1300" y="130" width="220" height="120" rx="18" fill="#E7F6F6" stroke="#66B9B5" stroke-width="2"/><rect x="1300" y="130" width="8" height="120" rx="4" fill="#277D79"/><text x="1321" y="160" class="node-title">App search</text><text x="1321" y="195" class="node-line">likely app choices</text><text x="1321" y="218" class="node-line">stay above the card</text></g>
<g><rect x="1300" y="300" width="220" height="120" rx="18" fill="#E9F7EF" stroke="#6EBD91" stroke-width="2"/><rect x="1300" y="300" width="8" height="120" rx="4" fill="#36875E"/><text x="1321" y="330" class="node-title">Task intent</text><text x="1321" y="365" class="node-line">registered card</text><text x="1321" y="388" class="node-line">renders below apps</text></g>
<g><rect x="1000" y="505" width="285" height="145" rx="18" fill="#F2EDFF" stroke="#9877DC" stroke-width="2"/><rect x="1000" y="505" width="8" height="145" rx="4" fill="#7652C8"/><text x="1021" y="535" class="node-title">5 · Fill grounded fields</text><text x="1021" y="570" class="node-line">after a typing pause, optional</text><text x="1021" y="593" class="node-line">Gemini extraction for supported</text><text x="1021" y="616" class="node-line">cards; values require evidence</text></g>
<g><rect x="640" y="505" width="285" height="145" rx="18" fill="#EAF3FF" stroke="#5A8BD6" stroke-width="2"/><rect x="640" y="505" width="8" height="145" rx="4" fill="#3973BD"/><text x="661" y="535" class="node-title">6 · Review and edit</text><text x="661" y="570" class="node-line">query values populate fields</text><text x="661" y="593" class="node-line">missing details stay blank</text><text x="661" y="616" class="node-line">every field stays editable</text></g>
<g><rect x="280" y="505" width="285" height="145" rx="18" fill="#FFF4DF" stroke="#E2B45E" stroke-width="2"/><rect x="280" y="505" width="8" height="145" rx="4" fill="#B67B1F"/><text x="301" y="535" class="node-title">7 · Explicit next step</text><text x="301" y="570" class="node-line">preview interaction or hand-off</text><text x="301" y="593" class="node-line">no silent system action</text><text x="301" y="616" class="node-line">native APIs are not wired here</text></g>
<g><rect x="55" y="505" width="175" height="145" rx="18" fill="#E7F6F6" stroke="#66B9B5" stroke-width="2"/><rect x="55" y="505" width="8" height="145" rx="4" fill="#277D79"/><text x="76" y="535" class="node-title">/ palette</text><text x="76" y="570" class="node-line">local card catalog</text><text x="76" y="593" class="node-line">select → starter query</text><text x="76" y="616" class="node-line">no model needed</text></g>
<g><rect x="680" y="355" width="390" height="94" rx="18" fill="#FFF0F0" stroke="#DA8989" stroke-width="2"/><rect x="680" y="355" width="8" height="94" rx="4" fill="#AA4F54"/><text x="701" y="385" class="node-title">If JEV is unavailable</text><text x="701" y="420" class="node-line">show Error + Retry; do not classify locally</text></g>
<g><rect x="1065" y="730" width="455" height="94" rx="18" fill="#E9F7EF" stroke="#6EBD91" stroke-width="2"/><rect x="1065" y="730" width="8" height="94" rx="4" fill="#36875E"/><text x="1086" y="760" class="node-title">Trust boundary</text><text x="1086" y="795" class="node-line">approved choices + validated fields only</text></g><text x="55" y="872" class="footer">Examples: app search keeps apps in view · “weather in Houston” selects Weather · “coffee with Alex Friday at 1” drafts an Event.</text></svg>
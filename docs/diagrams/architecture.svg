<g><rect x="325" y="168" width="245" height="120" rx="18" fill="#E7F6F6" stroke="#66B9B5" stroke-width="2"/><rect x="325" y="168" width="8" height="120" rx="4" fill="#277D79"/><text x="346" y="198" class="node-title">React client</text><text x="346" y="233" class="node-line">300 ms prefix throttle</text><text x="346" y="256" class="node-line">stale-response guard</text></g>
<g><rect x="620" y="168" width="205" height="120" rx="18" fill="#FFF4DF" stroke="#E2B45E" stroke-width="2"/><rect x="620" y="168" width="8" height="120" rx="4" fill="#B67B1F"/><text x="641" y="198" class="node-title">POST /api/intent</text><text x="641" y="233" class="node-line">input validation</text><text x="641" y="256" class="node-line">JEV key stays server-side</text></g>
<g><rect x="875" y="150" width="255" height="156" rx="18" fill="#F2EDFF" stroke="#9877DC" stroke-width="2"/><rect x="875" y="150" width="8" height="156" rx="4" fill="#7652C8"/><text x="896" y="180" class="node-title">TypeSafe Jev</text><text x="896" y="215" class="node-line">mode · task intent · app</text><text x="896" y="238" class="node-line">app-retention signal</text><text x="896" y="261" class="node-line">approved vocabulary only</text></g>
